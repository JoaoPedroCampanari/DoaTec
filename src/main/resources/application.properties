spring.application.name=doatec

# Server
server.port=8080
server.forward-headers-strategy=NATIVE
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true

#--- CORS ---
app.cors.allowed-origins=http://localhost:8080

#--- PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/doatec
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#--- File Upload ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
upload.path=uploads

#--- Email (Mailhog for local development) ---
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enabled=false
app.email.from=no-reply@doatec.com